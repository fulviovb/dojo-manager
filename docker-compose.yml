# docker-compose.yml — escola-artes-marciais
#
# Uso:
#   docker compose up                          → sobe tudo
#   docker compose up mysql                    → só banco
#   docker compose logs -f backend             → logs do backend
#   docker compose exec backend sh             → shell no backend

services:

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: escola123
      MYSQL_DATABASE: escola_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - escola-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pescola123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend-modules:/app/node_modules
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - TZ=America/Sao_Paulo
    extra_hosts:
      # permite o backend alcançar serviços rodando fora do Docker (ex: o
      # módulo checkin-online/ em desenvolvimento, via host.docker.internal)
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - escola-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      # URL pública do módulo satélite checkin-online/ — usada só para montar
      # a URL exibida na tela de QR Codes (Configurações). Sem ela, cai de
      # volta pro endereço local (não alcançável de fora da rede).
      - REACT_APP_CHECKIN_ONLINE_PUBLIC_URL=https://karatevilasboas.duckdns.org
    networks:
      - escola-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - escola-network

networks:
  escola-network:
    driver: bridge

volumes:
  mysql-data:
  backend-modules:
  frontend-modules:
