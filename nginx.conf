events {}

http {
  server {
    listen 80;

    # Alias principal: /escola-am → frontend
    location /escola-am/ {
      proxy_pass http://frontend:3000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location = /escola-am {
      return 301 $scheme://$http_host/escola-am/;
    }

    # Assets do CRA (carregados como /static/...)
    location /static/ {
      proxy_pass http://frontend:3000/static/;
    }

    # Webpack dev server sockjs (hot reload)
    location /ws {
      proxy_pass http://frontend:3000/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # API
    location /api/ {
      proxy_pass http://backend:5000/api/;
      proxy_set_header Host $host;
    }
  }
}
